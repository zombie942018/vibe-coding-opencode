<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隨機單字卡</title>
<style>
  :root {
    --bg-1: #1e3a5f;
    --bg-2: #3a2d6e;
    --accent: #ffd166;
    --text-dark: #2b2d42;
    --card-height: 340px;
    --card-width: min(520px, 88vw);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: #fff;
  }

  header { text-align: center; }
  header h1 {
    font-size: 1.6rem;
    letter-spacing: 4px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  header p { font-size: 0.85rem; opacity: 0.75; }

  /* ---- 卡片容器 + 3D 翻面 ---- */
  .scene {
    width: var(--card-width);
    height: var(--card-height);
    perspective: 1400px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
    user-select: none;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px;
    border-radius: 24px;
    background: #ffffff;
    color: var(--text-dark);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    text-align: center;
  }

  .card-back { transform: rotateY(180deg); background: #fffdf5; }

  .word {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1.15;
    word-break: break-word;
  }

  .part-of-speech {
    font-size: 0.9rem;
    color: #777;
    letter-spacing: 2px;
    font-style: italic;
  }

  .translation { font-size: 2.4rem; font-weight: 700; line-height: 1.3; }

  .example {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #555;
    max-width: 90%;
  }
  .card-back .example { color: #666; }

  .hint {
    font-size: 0.8rem;
    color: #aaa;
    margin-top: auto;
    letter-spacing: 1px;
  }

  /* ---- 控制列 ---- */
  .controls {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  button:active { transform: scale(0.95); }

  .btn-flip {
    background: var(--accent);
    color: var(--text-dark);
    box-shadow: 0 6px 20px rgba(255, 209, 102, 0.35);
  }
  .btn-flip:hover { filter: brightness(1.07); }

  .btn-next {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(4px);
  }
  .btn-next:hover { background: rgba(255, 255, 255, 0.24); }

  .meta {
    font-size: 0.85rem;
    opacity: 0.8;
    letter-spacing: 1px;
  }

  footer {
    font-size: 0.75rem;
    opacity: 0.5;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <header>
    <h1>📚 隨機單字卡</h1>
    <p>點擊卡片翻面 · 空白鍵翻面 · Enter 下一題</p>
  </header>

  <!-- 卡片 -->
  <div class="scene">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="word" id="frontWord">—</div>
        <div class="part-of-speech" id="frontPos"></div>
        <div class="example" id="frontExample"></div>
        <div class="hint">點擊卡片查看中文</div>
      </div>
      <div class="card-face card-back">
        <div class="translation" id="backTrans">—</div>
        <div class="word" id="backWord"></div>
        <div class="example" id="backExample"></div>
        <div class="hint">點擊卡片回到英文</div>
      </div>
    </div>
  </div>

  <!-- 控制列 -->
  <div class="controls">
    <button class="btn-flip" id="btnFlip">翻面</button>
    <button class="btn-next" id="btnNext">下一題 🎲</button>
  </div>

  <div class="meta" id="meta"></div>

  <footer>內建 10 個單字 · 每次抽取不重複</footer>

<script>
  // ===== 單字庫：英文 / 詞性 / 中文 / 英例句 / 中例句 =====
  const WORDS = [
    {
      en: "resilient",
      pos: "adj.",
      zh: "有韌性的；能迅速恢復的",
      exEn: "She is resilient; she always bounces back quickly from setbacks.",
      exZh: "她很有韌性，遭遇挫折後總能迅速恢復。"
    },
    {
      en: "procrastinate",
      pos: "v.",
      zh: "拖延；耽擱",
      exEn: "Don't procrastinate — start your homework right now.",
      exZh: "別拖延了，現在就開始寫作業。"
    },
    {
      en: "meticulous",
      pos: "adj.",
      zh: "一絲不苟的；極度仔細的",
      exEn: "He is meticulous about keeping his desk perfectly organized.",
      exZh: "他對書桌的整潔要求得一絲不苟。"
    },
    {
      en: "ambiguous",
      pos: "adj.",
      zh: "模稜兩可的；含糊不清的",
      exEn: "The instructions were ambiguous, so I asked for clarification.",
      exZh: "說明含糊不清，所以我請求對方解釋清楚。"
    },
    {
      en: "pragmatic",
      pos: "adj.",
      zh: "務實的；講求實際的",
      exEn: "We need a pragmatic solution, not a theoretically perfect one.",
      exZh: "我們需要務實的解法，而不是理論上完美的方案。"
    },
    {
      en: "leverage",
      pos: "n. / v.",
      zh: "杠杆作用；利用（優勢）",
      exEn: "We can leverage our loyal customers to grow sales.",
      exZh: "我們可以利用忠實客戶來帶動業績成長。"
    },
    {
      en: "inevitable",
      pos: "adj.",
      zh: "不可避免的；必然發生的",
      exEn: "Change is inevitable; the question is how we adapt.",
      exZh: "改變不可避免，重點是我們如何適應。"
    },
    {
      en: "negotiate",
      pos: "v.",
      zh: "協商；談判",
      exEn: "They negotiated a better price for the contract.",
      exZh: "他們透過談判為合約爭取到更好的價格。"
    },
    {
      en: "versatile",
      pos: "adj.",
      zh: "多才多藝的；多用途的",
      exEn: "This tool is versatile — it works on wood, metal, and plastic.",
      exZh: "這個工具很萬用，木頭、金屬和塑膠都能處理。"
    },
    {
      en: "allocate",
      pos: "v.",
      zh: "分配；撥出（資源）",
      exEn: "The manager allocated extra resources to the new project.",
      exZh: "經理把額外資源分配給新專案。"
    }
  ];

  // ===== 狀態 =====
  let currentIndex = 0;       // 目前顯示的單字
  let remaining = [];         // 尚未抽過的索引池
  let shownCount = 0;         // 本輪已抽出的題數（正向計數）
  const cardEl = document.getElementById("card");

  // DOM 元素
  const frontWord = document.getElementById("frontWord");
  const frontPos  = document.getElementById("frontPos");
  const frontEx   = document.getElementById("frontExample");
  const backTrans = document.getElementById("backTrans");
  const backWord  = document.getElementById("backWord");
  const backEx    = document.getElementById("backExample");
  const metaEl    = document.getElementById("meta");

  // 洗牌（Fisher-Yates）
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 顯示指定索引的單字（預設正面朝上，即英文）
  function showCard(index) {
    const w = WORDS[index];
    frontWord.textContent  = w.en;
    frontPos.textContent   = w.pos;
    frontEx.textContent    = w.exEn;
    backTrans.textContent  = w.zh;
    backWord.textContent   = `(${w.pos}) ${w.en}`;
    backEx.textContent     = w.exZh;
    metaEl.textContent     = `第 ${shownCount} / ${WORDS.length} 題 · 剩餘 ${remaining.length} 個單字`;
    cardEl.classList.remove("flipped");  // 下一題回到英文面
  }

  // 抽出「不同於目前」的隨機單字
  function nextCard() {
    if (remaining.length === 0) {
      remaining = shuffle(WORDS.map((_, i) => i));
      shownCount = 0;  // 重新洗牌，題數歸零重算
      // 避免下一題立刻抽到同一張
      if (remaining.length > 1 && remaining[0] === currentIndex) {
        [remaining[0], remaining[1]] = [remaining[1], remaining[0]];
      }
    }
    currentIndex = remaining.shift();
    shownCount++;
    showCard(currentIndex);
  }

  // 翻面（若已翻到背面則翻回正面）
  function toggleFlip() {
    cardEl.classList.toggle("flipped");
  }

  // ===== 事件綁定 =====
  document.getElementById("btnFlip").addEventListener("click", toggleFlip);
  document.getElementById("btnNext").addEventListener("click", nextCard);
  cardEl.addEventListener("click", toggleFlip);

  // 鍵盤支援：空白鍵翻面、Enter 下一題
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown") {
      e.preventDefault();
      toggleFlip();
    } else if (e.code === "Enter" || e.code === "ArrowRight") {
      e.preventDefault();
      nextCard();
    }
  });

  // ===== 初始化：抽第一題 =====
  nextCard();
</script>
</body>
</html>
